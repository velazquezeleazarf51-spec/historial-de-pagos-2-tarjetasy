name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        working-directory: Historial-de-pagos-2-tarjetas-listo-para-GitHub
        run: npm install

      - name: Crear proyecto Android
        working-directory: Historial-de-pagos-2-tarjetas-listo-para-GitHub
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar aplicación
        working-directory: Historial-de-pagos-2-tarjetas-listo-para-GitHub
        run: npx cap sync android

      - name: Generar APK
        working-directory: Historial-de-pagos-2-tarjetas-listo-para-GitHub
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Historial-de-pagos-2-APK
          path: Historial-de-pagos-2-tarjetas-listo-para-GitHub/android/app/build/outputs/apk/debug/app-debug.apk
